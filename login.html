<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | KayumbiBet</title>
<meta name="theme-color" content="#07150f">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#07150f;color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{width:100%;max-width:410px}
.brand{text-align:center;font-size:32px;font-weight:900;letter-spacing:-1.5px;margin-bottom:28px}
.brand span{color:#c7f36b}
.card{background:#10251a;border:1px solid #254532;border-radius:17px;padding:26px 23px;box-shadow:0 18px 55px #0005}
.tag{display:inline-block;background:#203d27;color:#c7f36b;border-radius:5px;padding:7px 10px;font-size:10px;font-weight:800;letter-spacing:1.4px}
h1{font-size:27px;margin:17px 0 8px;letter-spacing:-.7px}
.sub{color:#a6b7aa;font-size:13px;line-height:1.6;margin:0 0 25px}
.field{margin-bottom:19px}
label{display:block;font-size:12px;font-weight:700;margin:0 0 9px}
input{width:100%;height:49px;background:#09180f;color:#fff;border:1px solid #34513c;border-radius:9px;padding:0 13px;font-size:14px;outline:none}
input:focus{border-color:#c7f36b}
.btn{width:100%;height:51px;background:#c7f36b;color:#102015;border:0;border-radius:9px;font-weight:900;font-size:15px;cursor:pointer}
.btn:hover{background:#d5ff83}
.error{color:#ffaaa5;font-size:12px;margin:7px 0 0}
.alert{background:#40201f;border:1px solid #7b3835;color:#ffd3cf;border-radius:8px;padding:12px;font-size:13px;margin-bottom:17px}
.foot{text-align:center;color:#9caf9f;font-size:12px;line-height:1.8;margin-top:21px}
a{color:#c7f36b;text-decoration:none;font-weight:700}
.back{display:block;text-align:center;margin-top:20px;font-size:12px}
.secure{text-align:center;font-size:10px;color:#779180;margin-top:17px}
</style>
</head>
<body>
<main class="wrap">
    <div class="brand">KAYUMBI<span>BET</span></div>
    <section class="card">
        <span class="tag">WELCOME BACK</span>
        <h1>Log in to KayumbiBet</h1>
        <p class="sub">Enter your registered phone number and password to continue.</p>

        <div id="notice" class="alert" role="status" hidden></div>

        <form id="login-form" method="POST" action="/login" novalidate>
            <div class="field">
                <label for="phone">PHONE NUMBER</label>
                <input type="tel" id="phone" name="phone" value=""
                    placeholder="Enter your phone number" autocomplete="tel"
                    inputmode="tel" maxlength="20" required autofocus>
            </div>

            <div class="field">
                <label for="password">PASSWORD</label>
                <input type="password" id="password" name="password"
                    placeholder="Enter your password" autocomplete="current-password"
                    maxlength="72" required>
            </div>

            <button type="submit" class="btn">LOG IN&nbsp; →</button>
        </form>

        <div class="foot">New to KayumbiBet? <a href="/register">Create an account</a></div>
    </section>
    <a href="/" class="back">← Back to KayumbiBet</a>
    <div class="secure">Keep your password private. Play responsibly.</div>
</main>
<script>
    // Demo build: there is no auth backend wired up yet, so the form reports
    // instead of posting to a server that does not exist.
    document.getElementById('login-form').addEventListener('submit', function (event) {
        event.preventDefault();
        var notice = document.getElementById('notice');
        notice.textContent = 'Demo build — no authentication server is connected yet.';
        notice.hidden = false;
    });
</script>
</body>
</html>
